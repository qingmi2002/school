services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_schedule_pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_schedule}
      POSTGRES_USER: ${POSTGRES_USER:-schedule_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schedule_admin} -d ${POSTGRES_DB:-smart_schedule}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smart_schedule_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_schedule_backend
    env_file:
      - .env
    volumes:
      - archive_staging:/app/archive_staging
      - ${ARCHIVE_HOST_DIR:-./archive_data}:/mnt/cloud_drive/SmartSchedule_Archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_schedule_worker
    env_file:
      - .env
    volumes:
      - archive_staging:/app/archive_staging
      - ${ARCHIVE_HOST_DIR:-./archive_data}:/mnt/cloud_drive/SmartSchedule_Archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_schedule_frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pg_data:
  archive_staging:
