name: SmartSchedule CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      run_docker_build:
        description: "是否执行 Docker 镜像构建校验"
        type: boolean
        default: false

# 同一分支连续 push 时自动取消旧队列，避免 Actions 额度浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smart_schedule_test
          POSTGRES_USER: schedule_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://schedule_admin:test_password@localhost:5432/smart_schedule_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migration smoke test
        run: alembic upgrade head
      - name: Run pytest
        run: pytest -v

  frontend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install & Build
        run: |
          npm install
          npm run build

  # 重型 Docker 构建仅在打 v* 发版标签或手动勾选触发时运行，避免日常提交消耗额度
  docker-build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-ci, frontend-ci]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.run_docker_build == true
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example config > /dev/null
      - name: Build images
        run: docker compose --env-file .env.example build
