name: Build & Publish Production Images (Release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发版版本号（同时自动更新 :latest 供 Linux 与 NAS 一键拉取）"
        required: true
        default: "v1.0.1"

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Determine version tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ github.ref_NAME }}" >> "$GITHUB_OUTPUT"
          fi
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image (version + latest)
        run: |
          BASE="ghcr.io/${{ steps.meta.outputs.OWNER }}/smart-schedule-backend"
          docker build -f backend/Dockerfile.prod -t "${BASE}:${{ steps.meta.outputs.TAG }}" -t "${BASE}:latest" ./backend
          docker push "${BASE}:${{ steps.meta.outputs.TAG }}"
          docker push "${BASE}:latest"

      - name: Build & Push Web Image (version + latest)
        run: |
          BASE="ghcr.io/${{ steps.meta.outputs.OWNER }}/smart-schedule-web"
          docker build -f frontend/Dockerfile.prod -t "${BASE}:${{ steps.meta.outputs.TAG }}" -t "${BASE}:latest" ./frontend
          docker push "${BASE}:${{ steps.meta.outputs.TAG }}"
          docker push "${BASE}:latest"
