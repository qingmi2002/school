# ==============================================================================
# 高校分级智能排课系统（多级通用版）— NAS 极简一键部署模板（已预填 qingmi2002）
# 适用平台：群晖 (Container Manager)、飞牛 OS (fnOS)、极空间、绿联、威联通、1Panel、Portainer
#
# 使用方法（零修改直接粘贴）：
#   1. 先在 https://github.com/qingmi2002/school/actions 点一次
#      "Build & Publish Production Images" -> Run workflow 生成 :latest 镜像，
#      并在 GitHub Packages 中将两个镜像设为 Public。
#   2. 在 NAS Docker Compose 新建项目，直接全文粘贴本文件，点击“启动”即可！
#   3. 访问 http://NAS的IP:8088 即可使用；排课归档自动保存在 ./cloud_archive 目录。
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_schedule_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_schedule
      POSTGRES_USER: schedule_admin
      POSTGRES_PASSWORD: SmartSchedule_ChangeMe_2026
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule_admin -d smart_schedule"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: smart_schedule_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    image: ghcr.io/qingmi2002/smart-schedule-backend:latest
    container_name: smart_schedule_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://schedule_admin:SmartSchedule_ChangeMe_2026@postgres:5432/smart_schedule
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ARCHIVE_LOCAL_ROOT: /mnt/cloud_drive/SmartSchedule_Archive
      ARCHIVE_STAGING_DIR: /app/archive_staging
    volumes:
      - ./data/archive_staging:/app/archive_staging
      - ./cloud_archive:/mnt/cloud_drive/SmartSchedule_Archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/qingmi2002/smart-schedule-backend:latest
    container_name: smart_schedule_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://schedule_admin:SmartSchedule_ChangeMe_2026@postgres:5432/smart_schedule
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ARCHIVE_LOCAL_ROOT: /mnt/cloud_drive/SmartSchedule_Archive
      ARCHIVE_STAGING_DIR: /app/archive_staging
    volumes:
      - ./data/archive_staging:/app/archive_staging
      - ./cloud_archive:/mnt/cloud_drive/SmartSchedule_Archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=2

  web:
    image: ghcr.io/qingmi2002/smart-schedule-web:latest
    container_name: smart_schedule_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"
